<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Plant Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            min-height: 20px;
        }

        .plant-container {
            position: relative;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .pot {
            width: 120px;
            height: 80px;
            background: linear-gradient(to bottom, #8B4513, #654321);
            border-radius: 0 0 10px 10px;
            position: relative;
            z-index: 10;
        }

        .pot::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            height: 20px;
            background: linear-gradient(to bottom, #A0522D, #8B4513);
            border-radius: 10px 10px 0 0;
        }

        .plant {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.5s ease;
        }

        .stem {
            width: 8px;
            background: linear-gradient(to right, #2d5016, #4a7c2c);
            margin: 0 auto;
            border-radius: 4px;
            transition: height 0.5s ease;
        }

        .leaves {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .leaf {
            width: 40px;
            height: 25px;
            background: #4a7c2c;
            border-radius: 0 100% 0 100%;
            transition: all 0.5s ease;
            opacity: 1;
        }

        .leaf.left {
            transform: rotate(-45deg) translateX(-15px);
        }

        .leaf.right {
            transform: rotate(45deg) translateX(15px);
            border-radius: 100% 0 100% 0;
        }

        .leaf.wilted {
            background: #6b4423;
            opacity: 0.5;
            transform: rotate(-80deg) translateX(-20px) translateY(10px);
        }

        .leaf.right.wilted {
            transform: rotate(80deg) translateX(20px) translateY(10px);
        }

        .stats {
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-top: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #333;
        }

        .price-change {
            font-size: 18px;
            font-weight: bold;
        }

        .price-change.positive {
            color: #22c55e;
        }

        .price-change.negative {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Stock Plant Tracker</h1>
        
        <div class="input-group">
            <input type="text" id="tickerInput" placeholder="Enter stock ticker (e.g., AAPL)" />
            <button onclick="startTracking()">Track</button>
        </div>

        <div class="status" id="status"></div>

        <div class="plant-container">
            <div class="plant" id="plant">
                <div class="leaves" id="leaves"></div>
                <div class="stem" id="stem" style="height: 50px;"></div>
            </div>
            <div class="pot"></div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-row">
                <span class="stat-label">Ticker:</span>
                <span class="stat-value" id="tickerDisplay"></span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Current Price:</span>
                <span class="stat-value" id="currentPrice">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Change:</span>
                <span class="price-change" id="priceChange">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Plant Health:</span>
                <span class="stat-value" id="plantHealth">50</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Green Ticks:</span>
                <span class="stat-value" style="color: #22c55e;" id="greenCount">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Red Ticks:</span>
                <span class="stat-value" style="color: #ef4444;" id="redCount">0</span>
            </div>
        </div>
    </div>

    <script>
        let ticker = '';
        let previousPrice = null;
        let plantHealth = 50;
        let greenCount = 0;
        let redCount = 0;
        let updateInterval = null;

        function startTracking() {
            const input = document.getElementById('tickerInput').value.trim().toUpperCase();
            if (!input) {
                document.getElementById('status').textContent = 'Please enter a ticker symbol';
                return;
            }

            ticker = input;
            previousPrice = null;
            plantHealth = 50;
            greenCount = 0;
            redCount = 0;

            document.getElementById('tickerDisplay').textContent = ticker;
            document.getElementById('stats').style.display = 'block';
            document.getElementById('status').textContent = 'Fetching initial price...';

            if (updateInterval) {
                clearInterval(updateInterval);
            }

            updatePrice();
            updateInterval = setInterval(updatePrice, 60000); // Update every 60 seconds
        }

        async function updatePrice() {
            try {
                // Using Alpha Vantage free API (limited to 25 calls per day)
                // Alternative: Use Twelve Data or Finnhub for more calls
                const response = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${ticker}&apikey=demo`);
                const data = await response.json();

                if (data['Global Quote'] && data['Global Quote']['05. price']) {
                    const currentPrice = parseFloat(data['Global Quote']['05. price']);
                    const change = parseFloat(data['Global Quote']['09. change']);

                    document.getElementById('currentPrice').textContent = `$${currentPrice.toFixed(2)}`;
                    document.getElementById('priceChange').textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${data['Global Quote']['10. change percent']})`;
                    document.getElementById('priceChange').className = `price-change ${change >= 0 ? 'positive' : 'negative'}`;

                    if (previousPrice !== null) {
                        if (currentPrice > previousPrice) {
                            growPlant();
                            greenCount++;
                            document.getElementById('status').textContent = '📈 Stock went up! Plant growing...';
                        } else if (currentPrice < previousPrice) {
                            witherPlant();
                            redCount++;
                            document.getElementById('status').textContent = '📉 Stock went down! Plant withering...';
                        } else {
                            document.getElementById('status').textContent = '➡️ No change';
                        }
                        
                        document.getElementById('greenCount').textContent = greenCount;
                        document.getElementById('redCount').textContent = redCount;
                    } else {
                        document.getElementById('status').textContent = `Tracking ${ticker}. Updates every minute.`;
                    }

                    previousPrice = currentPrice;
                } else {
                    document.getElementById('status').textContent = 'Error: Invalid ticker or API limit reached. Try again later.';
                }
            } catch (error) {
                document.getElementById('status').textContent = 'Error fetching data. Check your connection.';
                console.error(error);
            }
        }

        function growPlant() {
            plantHealth = Math.min(100, plantHealth + 5);
            updatePlantVisuals();
        }

        function witherPlant() {
            plantHealth = Math.max(0, plantHealth - 5);
            updatePlantVisuals();
        }

        function updatePlantVisuals() {
            const stemHeight = 30 + (plantHealth * 1.2);
            const leafCount = Math.floor(plantHealth / 20);
            
            document.getElementById('stem').style.height = stemHeight + 'px';
            document.getElementById('plantHealth').textContent = plantHealth;

            const leavesContainer = document.getElementById('leaves');
            leavesContainer.innerHTML = '';

            for (let i = 0; i < leafCount; i++) {
                const leftLeaf = document.createElement('div');
                leftLeaf.className = 'leaf left';
                if (plantHealth < 30) leftLeaf.classList.add('wilted');
                
                const rightLeaf = document.createElement('div');
                rightLeaf.className = 'leaf right';
                if (plantHealth < 30) rightLeaf.classList.add('wilted');

                const pair = document.createElement('div');
                pair.style.position = 'relative';
                pair.style.height = '30px';
                pair.appendChild(leftLeaf);
                pair.appendChild(rightLeaf);
                
                leavesContainer.appendChild(pair);
            }
        }

        // Initialize plant with default state
        updatePlantVisuals();
    </script>
</body>
</html>
