<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Troubleshooting Guide</title>
    <style>
        :root {
            --primary: #8b0000; /* Deep Accordion Red */
            --bg: #fdfaf6;
            --text: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        #container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 8px solid var(--primary);
        }

        h1 { color: var(--primary); text-align: center; margin-top: 0; }
        .breadcrumb { font-size: 0.8rem; color: #888; margin-bottom: 20px; text-transform: uppercase; }

        .question { font-size: 1.25rem; font-weight: bold; margin-bottom: 20px; }

        .options { display: flex; flex-direction: column; gap: 10px; }

        button {
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            transition: all 0.2s;
            text-align: left;
        }

        button:hover {
            background-color: #fff5f5;
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(5px);
        }

        .diagnosis {
            background: #f0f7ff;
            border-left: 5px solid #2196F3;
            padding: 20px;
            border-radius: 4px;
        }

        .warning {
            background: #fff0f0;
            border-left: 5px solid #d32f2f;
            padding: 15px;
            font-weight: bold;
            margin-top: 15px;
        }

        .reset-btn {
            margin-top: 30px;
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            width: auto;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="container">
    <div class="breadcrumb" id="breadcrumb">Start</div>
    <div id="display-area">
        </div>
    <button class="reset-btn" onclick="resetFlow()">↺ Start Over</button>
</div>

<script>
    const tree = {
        id: "start",
        question: "What is the primary symptom you are experiencing?",
        options: [
            { text: "Air Leak (Bellows/Air loss)", next: "leak" },
            { text: "Note Issue (Silent, buzzing, or out of tune)", next: "note" },
            { text: "Mechanical (Stuck keys or buttons)", next: "mechanical" }
        ]
    };

    const nodes = {
        leak: {
            question: "Does air leak even when no keys or buttons are pressed?",
            options: [
                { text: "Yes, it hisses constantly", next: "constant_leak" },
                { text: "No, it only leaks when playing", next: "playing_leak" }
            ]
        },
        constant_leak: {
            diagnosis: "Likely a <strong>Bellows Gasket</strong> or <strong>Pallet</strong> issue. Check the foam/leather tape where the bellows meets the wooden case. If the gasket is flat, air escapes before you even hit a note.",
            warning: "George Bachich Tip: Do not use hardware store weatherstripping! It is often too thick and can warp the bellows pins."
        },
        playing_leak: {
            diagnosis: "Likely a <strong>Pallet Facing</strong> issue. One of the felt/leather pads under the keys isn't seating flat against the soundboard holes. Look for debris or a bent key rod."
        },
        note: {
            question: "Does the problem happen on the PUSH, the PULL, or BOTH?",
            options: [
                { text: "Push Only", next: "push_pull_logic" },
                { text: "Pull Only", next: "push_pull_logic" },
                { text: "Both directions", next: "both_directions" }
            ]
        },
        push_pull_logic: {
            diagnosis: "This is a <strong>Reed Valve (Leather)</strong> or <strong>Debris</strong> issue. Since it's only one direction, only one of the two reeds in that set is vibrating. A 'buzzing' sound usually means the leather valve is curling.",
            warning: "Use the 'Gravity Test': If the leather hangs open more than 1/16th of an inch, it needs to be flattened or replaced."
        },
        both_directions: {
            diagnosis: "If the note is silent in both directions, a piece of dust is likely jammed in the reed tongue. If it's out of tune, the reed itself may be fatigued or the beeswax seal is cracked."
        },
        mechanical: {
            question: "Where is the mechanical stickiness located?",
            options: [
                { text: "Piano Keyboard / Treble Side", next: "treble_stick" },
                { text: "Bass Buttons", next: "bass_stick" }
            ]
        },
        treble_stick: {
            diagnosis: "Check for <strong>rod friction</strong>. Often, a slight bend in the aluminum key rod or a sticky guide slot is the culprit. Clean with naphtha; NEVER use oil.",
        },
        bass_stick: {
            diagnosis: "The Bass Machine is complex. Usually, a button is caught on the edge of the celluloid or a piston is bent.",
            warning: "CRITICAL: Do not force the button down. You will bend the delicate brass pins inside, turning a simple fix into a total overhaul."
        }
    };

    let history = ["Start"];

    function renderNode(nodeId) {
        const display = document.getElementById('display-area');
        const breadcrumb = document.getElementById('breadcrumb');
        const node = nodes[nodeId] || tree;
        
        breadcrumb.innerText = history.join(" > ");
        
        let html = '';
        if (node.question) {
            html += `<div class="question">${node.question}</div>`;
            html += `<div class="options">`;
            node.options.forEach(opt => {
                html += `<button onclick="selectOption('${opt.next}', '${opt.text}')">${opt.text}</button>`;
            });
            html += `</div>`;
        } else if (node.diagnosis) {
            html += `<div class="diagnosis"><h3>The Diagnosis:</h3><p>${node.diagnosis}</p></div>`;
            if (node.warning) {
                html += `<div class="warning">${node.warning}</div>`;
            }
        }
        
        display.innerHTML = html;
    }

    function selectOption(nextId, text) {
        history.push(text);
        renderNode(nextId);
    }

    function resetFlow() {
        history = ["Start"];
        renderNode("start");
    }

    // Initial Load
    renderNode("start");
</script>

</body>
</html>
